name: iOS Build and TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject local.dart
        env:
          LOCAL_DART: ${{ secrets.LOCAL_DART_CONTENT }}
        run: |
          mkdir -p lib/config
          echo "$LOCAL_DART" > lib/config/local.dart

      - name: Apply Team ID placeholders
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/YOUR_TEAM_ID/$TEAM_ID/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/YOUR_TEAM_ID/$TEAM_ID/g" ios/ExportOptions.plist

      - name: Install Apple certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          P12_PATH=$RUNNER_TEMP/cert.p12

          echo -n "$P12_BASE64" | base64 --decode -o "$P12_PATH"

          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISION_BASE64: ${{ secrets.IOS_MOBILE_PROVISION_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/treehole_app_store.mobileprovision
          echo -n "$PROVISION_BASE64" | base64 --decode -o "$PP_PATH"

          echo "=== Provisioning profile info ==="
          security cms -D -i "$PP_PATH" | plutil -p - | grep -E "Name|TeamIdentifier|application-identifier|UUID"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios
          pod install

      - name: Build IPA
        run: flutter build ipa --export-options-plist=ios/ExportOptions.plist --release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: treehole-ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.private_keys"
          echo -n "$API_KEY_P8" | base64 --decode -o "$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"